# Run the Module 4 test suite against a real PostgreSQL server.
#
# This file exists twice, byte for byte:
#
#   .github/workflows/tests.yml          <- the one GitHub actually runs
#   module_4/.github/workflows/tests.yml <- a copy, because everything this
#                                           workflow runs belongs to module_4
#                                           and the module should be readable
#                                           on its own
#
# GitHub reads workflows only from the repository root, so the copy is inert.
# Edit this one. The two are compared by a test -- see
# module_4/tests/test_workflow_copy.py -- so a change to either without the
# other fails the suite rather than leaving a stale copy for someone to read.
#
# The `db` and `integration` tests create, truncate and drop tables, so they are
# given their own database inside the service container -- the same arrangement
# as a development machine, where TEST_DATABASE_URL points at a scratch database
# and the fixtures refuse to run if it names the application's own.

name: tests

on:
  push:
    branches: [main]
    paths:
      - "module_4/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "module_4/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: pytest and docs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe
        ports:
          - 5432:5432
        # Without this the first test can reach the container before the server
        # inside it is accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The application's database, and the scratch one the tests are allowed to
      # empty. Two different names, which is what the fixtures check for.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The version the application is developed on and the version
          # requirements.txt is pinned against.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: module_4/requirements.txt

      - name: Install dependencies
        # requirements.txt minus llama-cpp-python, huggingface_hub and the
        # packages only they pull in. The standardizer is a subprocess the pull
        # injects and the suite always replaces, so installing it would mean
        # several minutes compiling a C++ extension no test ever calls.
        run: |
          grep -v -E '^(llama-cpp-python|huggingface_hub|diskcache|hf-xet|fsspec|filelock|numpy|tqdm)==' \
            module_4/requirements.txt > "${RUNNER_TEMP}/ci-requirements.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "${RUNNER_TEMP}/ci-requirements.txt"

      - name: Create the scratch test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE gradcafe_test'

      - name: Run the test suite with coverage
        # The same command README.md and pytest.ini document. --cov-fail-under
        # lives in pytest.ini, so a drop in coverage fails the job here too.
        run: python -m pytest module_4 -m "web or buttons or analysis or db or integration"

      - name: Build the Sphinx documentation
        # Warnings are errors: a broken cross-reference, or a module autodoc can
        # no longer import, is a build failure rather than a line of log nobody
        # reads.
        run: python -m sphinx -W --keep-going -b html module_4/docs "${RUNNER_TEMP}/docs-html"
