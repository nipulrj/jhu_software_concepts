# Pytest configuration for the Module 4 test suite.
#
# Run the whole suite from the repository root, so that the --cov path below
# resolves:
#
#     python -m pytest module_4
#
# or, equivalently, only the marked tests -- which is the same thing, because
# every test carries at least one of the five markers:
#
#     python -m pytest module_4 -m "web or buttons or analysis or db or integration"
#
# --cov-fail-under=100 makes a drop in coverage a test failure rather than a
# number nobody reads, which is the whole point of measuring it.

[pytest]
addopts = -q --cov=module_4/src --cov-report=term-missing --cov-fail-under=100
testpaths = tests
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
