# Read the Docs build configuration.
#
# Must live at the root of the repository, which is why it is here rather than
# under module_4. Everything it builds is in module_4/docs.
#
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: module_4/docs/conf.py
  # Deliberately NOT fail_on_warning here. .github/workflows/tests.yml builds
  # these same pages with -W on every push, so a broken cross-reference is
  # already caught where the cost is a red check. Repeating the strictness on
  # Read the Docs would only add a way for the published site to disappear.
  fail_on_warning: false

python:
  install:
    - requirements: module_4/docs/requirements.txt

formats:
  - htmlzip
