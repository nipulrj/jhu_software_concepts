# Read the Docs build configuration.
#
# Must live at the root of the repository, which is why it is here rather than
# under module_4. Everything it builds is in module_4/docs.
#
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: module_4/docs/conf.py
  # Warnings are errors, the same as in CI: a broken cross-reference or a
  # module autodoc can no longer import should fail the build rather than
  # publish a page with a hole in it.
  fail_on_warning: true

python:
  install:
    - requirements: module_4/docs/requirements.txt

formats:
  - htmlzip
